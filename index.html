<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0071ce">
  <title>Walmart Time</title>
  <style>
    :root {
      color-scheme: dark;
      --blue: #0071ce;
      --deep-blue: #004f9e;
      --navy: #001e60;
      --yellow: #ffc220;
      --ink: #ffffff;
      --muted: #d9efff;
      --light-blue: #8bd2ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 44%, rgba(0, 113, 206, .92), transparent 30rem),
        linear-gradient(135deg, var(--navy) 0%, var(--deep-blue) 48%, var(--blue) 100%);
    }

    .stage { position: relative; min-height: 100vh; isolation: isolate; }
    .stage::before {
      position: absolute; inset: 0; z-index: -1; content: "";
      opacity: .18;
      background-image: linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(circle, black, transparent 75%);
    }

    header {
      display: flex; align-items: center; gap: 1.2rem;
      padding: 2.5rem clamp(1.5rem, 6vw, 6rem);
    }

    .brand { display: flex; align-items: center; }
    .spark-logo { display: block; width: 3.6rem; height: 3.6rem; object-fit: contain; }
    .date { color: var(--ink); font-size: clamp(1.25rem, 2.6vw, 1.8rem); font-weight: 650; letter-spacing: .01em; }

    main { display: grid; place-items: center; min-height: calc(100vh - 8rem); padding: 1.5rem; text-align: center; }
    .clock-card {
      position: relative; width: min(94vw, 1100px); padding: clamp(3rem, 9vw, 8rem) 2rem;
      border: 1px solid rgba(255,255,255,.25); border-radius: 2rem;
      background: rgba(0, 37, 76, .38); box-shadow: 0 2rem 6rem rgba(0, 18, 42, .35), inset 0 1px rgba(255,255,255,.12);
      backdrop-filter: blur(12px); overflow: hidden;
    }
    .clock-card::after { position: absolute; inset: 0; content: ""; pointer-events: none; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.09), transparent 70%); transform: translateX(-100%); animation: sheen 8s infinite; }
    .eyebrow { margin: 0 0 1.4rem; color: var(--yellow); font-size: clamp(1rem, 1.8vw, 1.3rem); font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
    #clock { margin: 0; color: var(--ink); font-size: clamp(5.5rem, 19vw, 15rem); font-weight: 800; letter-spacing: -.08em; line-height: .95; text-shadow: 0 .15rem 1.5rem rgba(0,0,0,.3); font-variant-numeric: tabular-nums; }
    #ampm { display: inline-block; margin-left: .4em; color: var(--yellow); font-size: .24em; letter-spacing: .05em; vertical-align: .75em; }
    #timezone { margin: 2rem 0 0; color: var(--muted); font-size: clamp(1.1rem, 2vw, 1.35rem); }

    .floaters { position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
    .floater { position: absolute; opacity: .8; color: var(--yellow); animation: drift var(--duration) linear infinite; animation-delay: var(--delay); }
    .floater.star { width: 2rem; height: 2rem; background: currentColor; clip-path: polygon(50% 0%, 61% 38%, 100% 50%, 61% 62%, 50% 100%, 39% 62%, 0% 50%, 39% 38%); }
    .floater.cart { color: var(--light-blue); font-size: 2.6rem; filter: drop-shadow(0 0 8px currentColor); }
    .floater.box { width: 1.8rem; height: 1.8rem; border: 3px solid var(--light-blue); transform: rotate(45deg); }

    @keyframes drift { from { transform: translate3d(0, 110vh, 0) rotate(0deg) scale(.5); } to { transform: translate3d(var(--sway), -20vh, 0) rotate(360deg) scale(1.2); } }
    @keyframes sheen { 0%, 55% { transform: translateX(-100%); } 75%, 100% { transform: translateX(100%); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
    @media (max-width: 600px) { header { gap: .7rem; padding-top: 1.25rem; } .spark-logo { width: 2.8rem; height: 2.8rem; } .date { font-size: 1rem; } .clock-card { border-radius: 1.25rem; padding-inline: 1rem; } }
  </style>
</head>
<body>
  <div class="stage">
    <header>
      <div class="brand" aria-label="Walmart-inspired clock">
        <img class="spark-logo" src="spark-logo.png" alt="">
      </div>
      <time class="date" id="date" datetime=""></time>
    </header>

    <main>
      <section class="clock-card" aria-labelledby="clock-label">
        <div class="floaters" aria-hidden="true">
          <span class="floater star" style="left:8%;--duration:13s;--delay:-3s;--sway:80px"></span>
          <span class="floater cart" style="left:24%;--duration:17s;--delay:-11s;--sway:-100px"></span>
          <span class="floater box" style="left:74%;--duration:15s;--delay:-7s;--sway:130px"></span>
          <span class="floater star" style="left:88%;--duration:11s;--delay:-8s;--sway:-70px"></span>
          <span class="floater cart" style="left:58%;--duration:19s;--delay:-14s;--sway:-120px"></span>
        </div>
        <p class="eyebrow" id="clock-label">Right on time</p>
        <h1 id="clock" aria-live="off">--:--<span id="ampm"></span></h1>
        <p id="timezone">Your local time</p>
      </section>
    </main>
  </div>

  <script>
    const clock = document.querySelector('#clock');
    const ampm = document.querySelector('#ampm');
    const date = document.querySelector('#date');
    const zone = document.querySelector('#timezone');
    const timeFormatter = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit', second: '2-digit' });
    const dateFormatter = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

    function updateClock() {
      const now = new Date();
      const parts = timeFormatter.formatToParts(now);
      const get = type => parts.find(part => part.type === type)?.value || '';
      clock.firstChild.nodeValue = `${get('hour')}:${get('minute')}:${get('second')}`;
      ampm.textContent = get('dayPeriod');
      date.textContent = dateFormatter.format(now);
      date.dateTime = now.toISOString();
      zone.textContent = `${Intl.DateTimeFormat().resolvedOptions().timeZone.replaceAll('_', ' ')} · Your local time`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
